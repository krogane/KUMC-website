name: Build and deploy Pages
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main' && vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    env:
      PUBLIC_SITE_URL: https://kumc-club.net
      PUBLIC_ANALYTICS_ENABLED: 'false'
      PUBLIC_GA_MEASUREMENT_ID: ''
      PUBLIC_JOIN_URL: ${{ vars.PUBLIC_JOIN_URL }}
      DEPLOY_TARGET: preview
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Find trusted snapshot
        id: snapshot
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({owner:context.repo.owner,repo:context.repo.repo,workflow_id:'pages.yml',branch:'main',status:'success',per_page:20});
            for (const run of runs.data.workflow_runs) {
              if (!['push','schedule','workflow_dispatch'].includes(run.event)) continue;
              if (run.head_repository?.full_name !== context.payload.repository.full_name) continue;
              const list = await github.rest.actions.listWorkflowRunArtifacts({owner:context.repo.owner,repo:context.repo.repo,run_id:run.id});
              if (list.data.artifacts.some(a=>a.name==='feed-snapshot'&&!a.expired)) { core.setOutput('run-id',String(run.id)); break; }
            }
      - name: Restore trusted snapshot (bundled fallback on failure)
        if: steps.snapshot.outputs.run-id != ''
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: feed-snapshot
          path: .cache
          run-id: ${{ steps.snapshot.outputs.run-id }}
          github-token: ${{ github.token }}
      - run: npm run feeds
      - run: npm run verify
      - run: npm run test:publication
      - run: npm run audit:secrets
      - run: npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
      - name: Build production (missing analytics configuration stops here)
        run: npm run build
        env:
          DEPLOY_TARGET: production
          PUBLIC_ANALYTICS_ENABLED: 'true'
          PUBLIC_GA_MEASUREMENT_ID: ${{ vars.PUBLIC_GA_MEASUREMENT_ID || 'G-6RPY79DMKZ' }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: feed-snapshot
          path: .cache/feeds.json
          include-hidden-files: true
          retention-days: 90
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: verification-results
          path: |
            .qa/playwright-results.json
            test-results/
          include-hidden-files: true
          retention-days: 14
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy validated static artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
